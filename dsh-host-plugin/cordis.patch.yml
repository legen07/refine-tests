# The Loader patch: one Host plugin row owning the `refine_tests` tool.
#
# The row `name` is the module specifier the Loader imports — it must equal
# the dependency key under which this package is installed in the profile
# (e.g. `refine-tests` from `dsh plugin --profile <p> add
# file:/home/joe/Dev/refine-tests`). The row carries no config: the CLI's own
# config.toml / .refine-tests.toml remain the single source of truth
# (ASSUMPTIONS A1).
- insert:
    - id: refine-tests
      name: 'refine-tests'
      config: {}
